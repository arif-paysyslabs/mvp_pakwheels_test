<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" fill="none">
  <!-- Steering wheel icon -->
  <g transform="translate(22, 22)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="16" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <!-- Inner hub -->
    <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
    <!-- Spokes -->
    <line x1="0" y1="-4" x2="0" y2="-13" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-3.5" y1="2" x2="-11.3" y2="6.5" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="3.5" y1="2" x2="11.3" y2="6.5" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Speed lines -->
    <line x1="-20" y1="-6" x2="-24" y2="-8" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="-19" y1="0" x2="-24" y2="0" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="-20" y1="6" x2="-24" y2="8" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Text: Pak -->
  <text x="46" y="30" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Pak</text>
  <!-- Text: Wheels -->
  <text x="107" y="30" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#f59e0b" letter-spacing="-0.5">Wheels</text>
</svg>
