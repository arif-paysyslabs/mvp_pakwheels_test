<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Documentation — PakWheels MVP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    .topbar {
      background: #1f2937;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .topbar a { text-decoration: none; color: inherit; }
    .topbar .logo { display: flex; align-items: center; }
    .topbar .logo img { height: 28px; width: auto; }
    .topbar nav { display: flex; gap: 16px; flex: 1; }
    .topbar nav a { color: #d1d5db; font-size: 13px; font-weight: 500; transition: color 0.2s; }
    .topbar nav a:hover { color: #fff; }
    .topbar nav a.active { color: #f59e0b; }

    .swagger-ui .topbar { display: none; }
    .swagger-ui .info { margin: 20px 0; }
    .swagger-ui .info .title { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 800; }
    .swagger-ui .info .description p { font-family: 'Inter', sans-serif; }

    body.swagger-body { margin: 0; background: #f3f4f6; }

    .footer {
      background: #1f2937; color: #9ca3af; text-align: center;
      padding: 20px; font-size: 12px; font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="swagger-body">
  <header class="topbar">
    <a href="/" class="logo"><img src="/logo.svg" alt="PakWheels"></a>
    <nav>
      <a href="/">Home</a>
      <a href="/sell">Post an Ad</a>
      <a href="/api-docs" class="active">API Docs</a>
    </nav>
  </header>

  <div id="swagger-ui"></div>

  <footer class="footer">
    &copy; 2026 PakWheels MVP &mdash; Demo Prototype
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script>
    SwaggerUIBundle({
      url: '/openapi.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      defaultModelsExpandDepth: -1,
      defaultModelExpandDepth: 2,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: 'BaseLayout',
      requestInterceptor: (req) => {
        req.headers['Content-Type'] = 'application/json';
        return req;
      }
    });
  </script>
</body>
</html>
